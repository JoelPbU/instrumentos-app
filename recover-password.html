<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recuperar contraseña</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<div class="auth-box">
  <div class="auth-logo"><b>Armonía</b></div>
  <div class="auth-card">
    <p class="msg">Estás a un paso de tu nueva contraseña, recupérala ahora.</p>
    <form id="form" novalidate>
      <div class="field"><div class="input-group"><input class="form-control" id="email" type="email" placeholder="Email de tu cuenta"><span class="addon" id="i0"></span></div></div>
      <div class="field"><div class="input-group"><input class="form-control" id="pass" type="password" placeholder="Contraseña" autocomplete="new-password"><span class="addon" id="i1"></span></div></div>
      <div class="field"><div class="input-group"><input class="form-control" id="pass2" type="password" placeholder="Confirmar contraseña" autocomplete="new-password"><span class="addon" id="i2"></span></div></div>
      <button class="btn btn-primary btn-block" type="submit">Cambiar contraseña</button>
    </form>
    <a class="auth-links" href="login.html">Iniciar sesión</a>
  </div>
</div>
<script src="js/app.js"></script>
<script>
$('#i0').innerHTML = icon('mail'); $('#i1').innerHTML = icon('lock'); $('#i2').innerHTML = icon('lock');
$('#form').onsubmit = e => {
  e.preventDefault();
  const em = $('#email'), p = $('#pass'), p2 = $('#pass2');
  const users = Auth.users();
  const u = users.find(x => x.email.toLowerCase() === em.value.trim().toLowerCase());
  const ok = [
    setErr(em, u ? '' : 'No existe una cuenta con ese email'),
    setErr(p, p.value.length >= 6 ? '' : 'Mínimo 6 caracteres'),
    setErr(p2, p2.value === p.value ? '' : 'Las contraseñas no coinciden')
  ].every(Boolean);
  if (!ok) return;
  u.password = p.value; DB.set('users', users);
  toast('Contraseña actualizada');
  setTimeout(() => location.href = 'login.html', 900);
};
</script>
</body>
</html>
