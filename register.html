<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<div class="auth-box">
  <div class="auth-logo"><b>Armonía</b></div>
  <div class="auth-card">
    <p class="msg">Registrar una nueva cuenta</p>
    <form id="form" novalidate>
      <div class="field"><div class="input-group"><input class="form-control" id="nombre" placeholder="Nombre completo"><span class="addon" id="i0"></span></div></div>
      <div class="field"><div class="input-group"><input class="form-control" id="email" type="email" placeholder="Email"><span class="addon" id="i1"></span></div></div>
      <div class="field"><div class="input-group"><input class="form-control" id="pass" type="password" placeholder="Contraseña" autocomplete="new-password"><span class="addon" id="i2"></span></div></div>
      <div class="field"><div class="input-group"><input class="form-control" id="pass2" type="password" placeholder="Repetir contraseña" autocomplete="new-password"><span class="addon" id="i3"></span></div></div>
      <div class="field"><div class="row-between" style="margin:0"><label><input type="checkbox" id="terms"> Acepto los términos</label><button class="btn btn-primary" type="submit">Registrar</button></div><div class="err" id="terms-err"></div></div>
    </form>
    <button class="btn btn-danger btn-block" data-social>Registrarse con Facebook</button>
    <button class="btn btn-danger btn-block" data-social>Registrarse con Google+</button>
    <a class="auth-links" href="login.html">Ya tengo una cuenta</a>
  </div>
</div>
<script src="js/app.js"></script>
<script>
$('#i0').innerHTML = icon('user'); $('#i1').innerHTML = icon('mail'); $('#i2').innerHTML = icon('lock'); $('#i3').innerHTML = icon('lock');
$$('[data-social]').forEach(b => b.onclick = () => toast('Registro social no disponible en esta demo', 'bad'));
$('#form').onsubmit = e => {
  e.preventDefault();
  const n = $('#nombre'), em = $('#email'), p = $('#pass'), p2 = $('#pass2');
  const users = Auth.users();
  const email = em.value.trim();
  const ok = [
    setErr(n, n.value.trim() ? '' : 'Ingresa tu nombre'),
    setErr(em, !/^\S+@\S+\.\S+$/.test(email) ? 'Email no válido' : users.some(u => u.email.toLowerCase() === email.toLowerCase()) ? 'Este email ya está registrado' : ''),
    setErr(p, p.value.length >= 6 ? '' : 'Mínimo 6 caracteres'),
    setErr(p2, p2.value === p.value ? '' : 'Las contraseñas no coinciden')
  ].every(Boolean);
  const termsOk = $('#terms').checked;
  $('#terms-err').textContent = termsOk ? '' : 'Debes aceptar los términos';
  if (!ok || !termsOk) return;
  users.push({ nombre: n.value.trim(), email, password: p.value });
  DB.set('users', users);
  toast('Cuenta creada. Ahora inicia sesión');
  setTimeout(() => location.href = 'login.html', 900);
};
</script>
</body>
</html>
