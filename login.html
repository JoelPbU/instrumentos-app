<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<div class="auth-box">
  <div class="auth-logo"><b>Armonía</b></div>
  <div class="auth-card">
    <p class="msg">Inicia sesión para comenzar</p>
    <form id="form" novalidate>
      <div class="field"><div class="input-group"><input class="form-control" id="email" type="email" placeholder="Email" autocomplete="username"><span class="addon" id="i1"></span></div></div>
      <div class="field"><div class="input-group"><input class="form-control" id="pass" type="password" placeholder="Contraseña" autocomplete="current-password"><span class="addon" id="i2"></span></div></div>
      <div class="row-between"><label><input type="checkbox" id="remember"> Recordarme</label><button class="btn btn-primary" type="submit">Entrar</button></div>
    </form>
    <button class="btn btn-danger btn-block" data-social>Iniciar con Facebook</button>
    <button class="btn btn-danger btn-block" data-social>Iniciar con Google+</button>
    <a class="auth-links" href="recover-password.html">Olvidé mi contraseña</a>
    <a class="auth-links" href="register.html">Registrar una nueva cuenta</a>
    <p class="msg" style="margin-top:14px;font-size:12.5px">Demo: admin@correo.com / 123456</p>
  </div>
</div>
<script src="js/app.js"></script>
<script>
if (Auth.current()) location.href = 'index.html';
Auth.users();
$('#i1').innerHTML = icon('mail'); $('#i2').innerHTML = icon('lock');
$$('[data-social]').forEach(b => b.onclick = () => toast('Acceso social no disponible en esta demo', 'bad'));
$('#form').onsubmit = e => {
  e.preventDefault();
  const em = $('#email'), pw = $('#pass');
  const ok = [setErr(em, /^\S+@\S+\.\S+$/.test(em.value.trim()) ? '' : 'Email no válido'), setErr(pw, pw.value ? '' : 'Ingresa la contraseña')].every(Boolean);
  if (!ok) return;
  if (Auth.login(em.value.trim(), pw.value, $('#remember').checked)) location.href = 'index.html';
  else setErr(pw, 'Email o contraseña incorrectos');
};
</script>
</body>
</html>
