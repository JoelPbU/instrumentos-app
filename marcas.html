<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrapper">
  <div class="main">
    <header class="navbar" id="navbar"></header>
    <section class="content-wrap">
      <!-- LISTAR -->
      <div id="view-list" class="card">
        <div class="card-header"><h2>Listado De Marcas</h2>
          <button class="btn btn-primary btn-add" id="btn-new" title="Agregar" aria-label="Agregar marca"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div class="card-body" id="table"></div>
      </div>

      <!-- AGREGAR / EDITAR -->
      <div id="view-form" class="card" hidden>
        <div class="card-header plain"><h3 id="form-title">Agregar marca</h3></div>
        <form id="form" novalidate>
          <div class="card-body form-grid">
            <div class="form-group"><label for="nombre">Nombre <span class="req">(*)</span></label>
              <input class="form-control" id="nombre" placeholder="Ej: Yamaha" maxlength="40"></div>
            <div class="form-group"><label for="pais">País de origen <span class="req">(*)</span></label>
              <input class="form-control" id="pais" placeholder="Ej: Japón" maxlength="40"></div>
            <div class="form-group"><label for="anio">Año de fundación <span class="req">(*)</span></label>
              <input class="form-control" id="anio" type="number" min="1500" max="2100" placeholder="Ej: 1887"></div>
            <div class="form-group"><label for="estado">Estado <span class="req">(*)</span></label>
              <select class="form-control" id="estado"><option>Activo</option><option>Inactivo</option></select></div>
          </div>
          <div class="card-footer"><button class="btn btn-primary" type="submit">Registrar</button>
            <button class="btn btn-danger" type="button" id="btn-back">Atrás</button></div>
        </form>
      </div>
    </section>
    <footer class="footer" id="footer"></footer>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/marcas.js"></script>
</body>
</html>
